events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;

    server {
        listen 8888 ssl;
        server_name localhost;

        ssl_certificate     /app/certs/cert.pem;
        ssl_certificate_key /app/certs/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Для удобства: /api/v1/swagger и /api/v1/swagger/ тоже ведут на Swagger UI
        location = /api/v1/swagger {
            return 302 /api/v1/swagger/index.html;
        }

        location = /api/v1/swagger/ {
            return 302 /api/v1/swagger/index.html;
        }

        # Backend API: все запросы /api/v1/... уходят во внутренний Go-сервер
        location /api/v1/ {
            proxy_pass http://127.0.0.1:8080/api/v1/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend React: открывается по https://localhost:8888/
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
